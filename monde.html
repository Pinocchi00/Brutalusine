<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Monde — Brutalusine</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 24px; background: #16121a; color: #ead7b8; font: 14px/1.4 ui-monospace, Consolas, monospace; }
    h1 { margin: 0 0 4px; font-size: 20px; color: #ffcc5c; }
    p.lead { margin: 0 0 20px; color: #b9a48a; }
    #grid { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
    figure { margin: 0; }
    figcaption { margin: 0 0 4px; color: #ffcc5c; }
    figure p { margin: 4px 0 0; font-size: 12px; color: #958170; }
    canvas.map { display: block; width: 256px; height: 256px; image-rendering: pixelated; border: 1px solid #3a323c; background: #120e15; }
  </style>
</head>
<body>
  <h1>Monde — six graines</h1>
  <p class="lead">256×256 cases, un pixel par case. <code>?graine=42</code> ou <code>?graine=1,2,3,4,5,6</code>.</p>
  <div id="grid"></div>
  <script type="module" src="/src/banc/monde.ts"></script>
</body>
</html>
